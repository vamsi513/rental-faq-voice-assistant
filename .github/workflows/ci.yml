name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Pinned rather than ubuntu-latest: that label migrates to Ubuntu 26 in
    # October 2026, and a runner image changing under the build is not a
    # surprise worth having.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Lint
        run: ruff check app tests eval scripts

      - name: Tests
        # No network and no API key: every test is offline by design, so a green run
        # here is the same run as a local one. Anything needing a real model or a real
        # n8n lives in eval/ and is not part of this job.
        run: pytest -q

      - name: Corpus consistency
        run: python scripts/check_corpus.py

  client:
    name: TypeScript client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        # Drives the client against a real ws server on an ephemeral port. No
        # network beyond loopback and no API key.
        run: npm test

      - name: Build
        run: npm run build
