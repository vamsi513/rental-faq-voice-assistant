name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Lint
        run: ruff check app tests eval scripts

      - name: Tests
        # No network and no API key: every test is offline by design, so a green run
        # here is the same run as a local one. Anything needing a real model or a real
        # n8n lives in eval/ and is not part of this job.
        run: pytest -q

      - name: Corpus consistency
        run: python scripts/check_corpus.py
